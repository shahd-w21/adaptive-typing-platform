name: typeflow
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: typeflow
      POSTGRES_PASSWORD: typeflow_local_only
      POSTGRES_DB: typeflow_dev
    ports:
      - '127.0.0.1:${TYPEFLOW_DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U typeflow -d typeflow_dev']
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  postgres-data:
