name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: typeflow
          POSTGRES_PASSWORD: typeflow_ci_only
          POSTGRES_DB: typeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typeflow -d typeflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ci-only-signing-secret-longer-than-thirty-two-characters
      DATABASE_URL: postgresql://typeflow:typeflow_ci_only@localhost:5432/typeflow_test
      TEST_DATABASE_URL: postgresql://typeflow:typeflow_ci_only@localhost:5432/typeflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
